      <stop offset="0%" stopColor="#00E5FF" />
      <stop offset="50%" stopColor="#A855F7" />
      <stop offset="100%" stopColor="#F43F5E" />
    </linearGradient>
    <linearGradient id="nRightSpike" x1="0%" y1="100%" x2="100%" y2="0%">
